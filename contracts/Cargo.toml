[workspace]
resolver = "2"
members = ["envelope", "vault", "mock-ft", "integration-tests"]

[workspace.package]
edition = "2021"
publish = false

# 의존성 추가는 A가 머지한다 (루트 CLAUDE.md §3)
[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
